<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>格斗之王 · Fist of Fighters</title>
<style>
  html,body{margin:0;height:100%;width:100%;background:#0a0a10;overflow:hidden;
    touch-action:none;-webkit-user-select:none;user-select:none;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{background:#000;max-width:100%;max-height:100%;width:auto;height:auto;
    touch-action:none;image-rendering:pixelated;box-shadow:0 0 60px rgba(0,0,0,.8);}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=540,GROUND=470,GRAV=0.9;

// ---------- input ----------
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(state==='title'&&e.code==='Enter')startMatch();
  if(state==='matchover'&&e.code==='Enter')state='title';
});
addEventListener('keyup',e=>{keys[e.code]=false;});

// ---------- touch (mobile) ----------
const isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
const touch={left:false,right:false,up:false,down:false,lp:false,hp:false,lk:false,hk:false,sp:false};
// on-screen buttons defined in canvas coordinates
const TB={
  left:{x:30,y:H-150,w:90,h:90,t:'←'},
  right:{x:160,y:H-150,w:90,h:90,t:'→'},
  up:{x:95,y:H-260,w:90,h:90,t:'↑'},
  down:{x:95,y:H-50,w:90,h:90,t:'↓'},
  lp:{x:W-260,y:H-130,w:74,h:74,t:'拳',k:'lp'},
  hp:{x:W-178,y:H-150,w:74,h:74,t:'重拳',k:'hp'},
  lk:{x:W-260,y:H-210,w:74,h:74,t:'脚',k:'lk'},
  hk:{x:W-178,y:H-230,w:74,h:74,t:'重脚',k:'hk'},
  sp:{x:W-96,y:H-160,w:80,h:80,t:'必杀',k:'sp'},
};
function canvasPos(t){const r=cv.getBoundingClientRect();
  return{x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)};}
function inBtn(p,b){return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;}
function applyTouches(touches){
  for(const k in touch)touch[k]=false;
  for(const t of touches){const p=canvasPos(t);
    for(const name in TB){if(inBtn(p,TB[name]))touch[name]=true;}}
}
function handleTouch(e){
  e.preventDefault();
  // tap to start / restart on menu screens
  if(state==='title'){startMatch();return;}
  if(state==='matchover'){state='title';return;}
  applyTouches(e.touches);
}
cv.addEventListener('touchstart',handleTouch,{passive:false});
cv.addEventListener('touchmove',handleTouch,{passive:false});
cv.addEventListener('touchend',handleTouch,{passive:false});
cv.addEventListener('touchcancel',handleTouch,{passive:false});

// ---------- fighter ----------
function Fighter(x,color,name,isP2){
  return{x,y:GROUND,vx:0,vy:0,w:46,h:120,color,name,isP2,
    face:isP2?-1:1,hp:100,maxhp:100,
    state:'idle',timer:0,onGround:true,
    atk:null,hitDone:false,blocking:false,crouch:false,
    hurtTimer:0,flash:0,super:0,projectiles:[],
    winsRound:0};
}
let P1,P2,projectiles=[];

// ---------- attacks: {dmg, range, startup, active, recover, reach, kb, type} ----------
const ATTACKS={
  lp:{dmg:6, startup:3, active:4, recover:8, reach:62, h:28, oy:-78, kb:4, name:'轻拳'},
  hp:{dmg:11,startup:7, active:5, recover:16,reach:74, h:32, oy:-80, kb:8, name:'重拳'},
  lk:{dmg:8, startup:5, active:5, recover:12,reach:70, h:30, oy:-40, kb:6, name:'轻脚'},
  hk:{dmg:14,startup:9, active:6, recover:20,reach:86, h:36, oy:-46, kb:11,name:'重脚'},
};

function startAttack(f,key){
  if(f.state==='hit'||f.state==='jump'||f.atk)return;
  const a=ATTACKS[key];
  f.atk={key,phase:'startup',t:0,def:a};
  f.hitDone=false;
  f.state='attack';
}

function fireball(f){
  if(f.super<50)return;
  f.super-=50;
  f.atk={key:'special',phase:'startup',t:0,def:{startup:10,active:2,recover:24,name:'必杀'}};
  f.hitDone=false; f.state='attack';
  f._fireQueued=true;
}

// ---------- AI ----------
function aiThink(f,foe){
  if(f.state==='hit'||f.atk){f.aiCmd=null;return;}
  const dist=Math.abs(f.x-foe.x);
  const dir=foe.x>f.x?1:-1;
  f.face=dir;
  f.aiCmd={left:false,right:false,jump:false,crouch:false,block:false,lp:false,hp:false,lk:false,hk:false,sp:false};
  // occasionally fire
  if(f.super>=50&&dist>260&&Math.random()<0.012){f.aiCmd.sp=true;return;}
  // block when foe attacking & close
  if(foe.atk&&foe.atk.phase!=='recover'&&dist<110&&Math.random()<0.6){
    f.aiCmd.block=true; f.aiCmd[dir>0?'left':'right']=true; return;
  }
  if(dist>120){ f.aiCmd[dir>0?'right':'left']=true;
    if(Math.random()<0.006)f.aiCmd.jump=true;
  } else if(dist<60){
    if(Math.random()<0.04)f.aiCmd[dir>0?'left':'right']=true; // back off
    else{const r=Math.random();
      if(r<0.3)f.aiCmd.lp=true;else if(r<0.5)f.aiCmd.hp=true;
      else if(r<0.7)f.aiCmd.lk=true;else if(r<0.85)f.aiCmd.hk=true;}
  } else {
    f.aiCmd[dir>0?'right':'left']=true;
    if(Math.random()<0.02)f.aiCmd.hk=true;
  }
}

// ---------- update ----------
function readInput(f,foe){
  let cmd;
  if(f.isP2&&aiOn){ aiThink(f,foe); cmd=f.aiCmd||{}; }
  else if(f.isP2){
    cmd={left:keys['Numpad4'],right:keys['Numpad6'],jump:keys['Numpad8'],crouch:keys['Numpad2'],
      lp:keys['Numpad7'],hp:keys['Numpad9'],lk:keys['Numpad1'],hk:keys['Numpad3'],sp:keys['Numpad5']};
  } else {
    cmd={left:keys['ArrowLeft']||touch.left,right:keys['ArrowRight']||touch.right,
      jump:keys['ArrowUp']||touch.up,crouch:keys['ArrowDown']||touch.down,
      lp:keys['KeyJ']||touch.lp,hp:keys['KeyK']||touch.hp,
      lk:keys['KeyU']||touch.lk,hk:keys['KeyI']||touch.hk,sp:keys['Space']||touch.sp};
  }
  return cmd;
}

function updateFighter(f,foe){
  if(f.flash>0)f.flash--;
  f.face=foe.x>f.x?1:-1;
  if(f.state==='hit'){
    f.hurtTimer--;
    f.x+=f.vx; f.vx*=0.85;
    if(f.hurtTimer<=0){f.state='idle';}
  }
  const cmd=readInput(f,foe);
  const canAct=f.state!=='hit'&&!f.atk;

  // attacks
  if(canAct&&f.onGround){
    if(cmd.sp)fireball(f);
    else if(cmd.hp)startAttack(f,'hp');
    else if(cmd.lp)startAttack(f,'lp');
    else if(cmd.hk)startAttack(f,'hk');
    else if(cmd.lk)startAttack(f,'lk');
  }

  // movement
  f.blocking=false; f.crouch=false;
  if(canAct){
    if(f.onGround&&cmd.jump){f.vy=-16;f.onGround=false;f.state='jump';}
    if(cmd.crouch&&f.onGround){f.crouch=true;}
    let mv=0;
    if(cmd.left)mv-=1; if(cmd.right)mv+=1;
    // blocking: holding away from foe on ground
    if(f.onGround&&((cmd.left&&f.face>0)||(cmd.right&&f.face<0))){f.blocking=true;}
    if(!f.crouch){f.x+=mv*4.2;}
    if(f.onGround&&!f.crouch&&mv!==0&&f.state!=='jump')f.state='walk';
    else if(f.onGround&&f.state!=='jump'&&!f.crouch)f.state='idle';
  }

  // gravity
  if(!f.onGround){ f.vy+=GRAV; f.y+=f.vy; f.x+=(cmd.left?-3:0)+(cmd.right?3:0);
    if(f.y>=GROUND){f.y=GROUND;f.onGround=true;f.vy=0;f.state='idle';}
  }

  // attack phases
  if(f.atk){
    const a=f.atk; a.t++;
    const d=a.def;
    if(a.phase==='startup'&&a.t>=d.startup){a.phase='active';a.t=0;
      if(f._fireQueued){spawnProjectile(f);f._fireQueued=false;}
    }
    else if(a.phase==='active'&&a.t>=d.active){a.phase='recover';a.t=0;}
    else if(a.phase==='recover'&&a.t>=d.recover){f.atk=null;f.state='idle';}
    // hit detection (melee only)
    if(a.phase==='active'&&!f.hitDone&&d.reach){
      const hb=attackBox(f);
      if(rectHit(hb,bodyBox(foe))){
        f.hitDone=true;
        applyHit(foe,f,d);
      }
    }
  }

  // super meter slowly builds
  if(f.super<100)f.super+=0.06;

  // bounds
  f.x=Math.max(40,Math.min(W-40,f.x));
}

function spawnProjectile(f){
  projectiles.push({x:f.x+f.face*40,y:GROUND-72,vx:f.face*8,owner:f,r:16,life:120,hit:false});
}

function attackBox(f){
  const d=f.atk.def;
  const reach=d.reach||0;
  const x=f.face>0?f.x+14:f.x-14-reach;
  return{x,y:f.y+ d.oy, w:reach, h:d.h};
}
function bodyBox(f){
  const h=f.crouch?f.h*0.6:f.h;
  return{x:f.x-f.w/2,y:f.y-h,w:f.w,h};
}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function applyHit(foe,attacker,d){
  const dir=attacker.face;
  if(foe.blocking&&foe.onGround){
    foe.hp-=d.dmg*0.18; foe.vx=dir*2; foe.flash=4;
    spawnSpark(foe.x+ -dir*20,foe.y-70,'#88ccff');
    return;
  }
  foe.hp-=d.dmg;
  foe.state='hit'; foe.hurtTimer=Math.round(8+d.dmg*0.8);
  foe.vx=dir*d.kb; foe.vy=0; foe.flash=6;
  foe.atk=null;
  attacker.super=Math.min(100,attacker.super+d.dmg*0.6);
  foe.super=Math.min(100,foe.super+d.dmg*0.3);
  spawnSpark(foe.x,foe.y-70,'#ffdd33');
  if(foe.hp<=0){foe.hp=0;}
}

// ---------- projectiles ----------
function updateProjectiles(){
  for(const p of projectiles){
    if(p.hit)continue;
    p.x+=p.vx; p.life--;
    const foe=p.owner===P1?P2:P1;
    if(rectHit({x:p.x-p.r,y:p.y-p.r,w:p.r*2,h:p.r*2},bodyBox(foe))){
      p.hit=true; applyHit(foe,{face:Math.sign(p.vx)},{dmg:12,kb:9});
      spawnSpark(p.x,p.y,'#ff66ff');
    }
    if(p.x<-30||p.x>W+30)p.life=0;
  }
  projectiles=projectiles.filter(p=>p.life>0&&!p.hit);
}

// ---------- particles ----------
let sparks=[];
function spawnSpark(x,y,col){for(let i=0;i<10;i++)sparks.push({x,y,
  vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:18,col});}
function updateSparks(){for(const s of sparks){s.x+=s.vx;s.y+=s.vy;s.vy+=0.3;s.life--;}
  sparks=sparks.filter(s=>s.life>0);}

// ---------- drawing ----------
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2a1a4a');g.addColorStop(.5,'#54306b');g.addColorStop(1,'#9a5a4a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // sun
  ctx.fillStyle='rgba(255,210,120,.25)';ctx.beginPath();ctx.arc(760,150,90,0,7);ctx.fill();
  // distant buildings
  ctx.fillStyle='rgba(20,10,40,.55)';
  for(let i=0;i<10;i++){const bw=70,bx=i*100-10,bh=120+((i*53)%140);
    ctx.fillRect(bx,GROUND-bh,bw,bh);}
  // floor
  ctx.fillStyle='#1c1622';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle='rgba(255,255,255,.06)';
  for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,GROUND);ctx.lineTo(i-60,H);ctx.stroke();}
}

function shade(hex,amt){let n=parseInt(hex.slice(1),16);
  let r=Math.max(0,Math.min(255,(n>>16)+amt));
  let g=Math.max(0,Math.min(255,((n>>8)&255)+amt));
  let b=Math.max(0,Math.min(255,(n&255)+amt));
  return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

// rounded, shaded "capsule" segment — gives limbs real volume
function capsule(x1,y1,x2,y2,r1,r2,base){
  const a=Math.atan2(y2-y1,x2-x1),px=Math.cos(a+Math.PI/2),py=Math.sin(a+Math.PI/2);
  const yA=Math.min(y1-r1,y2-r2),yB=Math.max(y1+r1,y2+r2);
  const g=ctx.createLinearGradient(0,yA,0,yB);
  g.addColorStop(0,shade(base,38));g.addColorStop(.55,base);g.addColorStop(1,shade(base,-42));
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x1+px*r1,y1+py*r1);ctx.lineTo(x2+px*r2,y2+py*r2);
  ctx.lineTo(x2-px*r2,y2-py*r2);ctx.lineTo(x1-px*r1,y1-py*r1);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.arc(x1,y1,r1,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x2,y2,r2,0,7);ctx.fill();
}
// two-segment limb with an elbow/knee joint, plus a hand/foot
function jointLimb(sx,sy,ex,ey,r1,r2,r3,bx,by,cUp,cLo,end,fl){
  const jx=(sx+ex)/2+bx,jy=(sy+ey)/2+by;
  capsule(sx,sy,jx,jy,r1,r2,cUp);
  capsule(jx,jy,ex,ey,r2,r3,cLo);
  if(end==='fist'){
    const g=ctx.createRadialGradient(ex-3,ey-3,1,ex,ey,r3+3);
    g.addColorStop(0,'#f2c79c');g.addColorStop(1,'#cf9266');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(ex,ey,r3+2,0,7);ctx.fill();
    ctx.strokeStyle='rgba(120,70,40,.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(ex-fl*r3,ey-r3*.4);ctx.lineTo(ex+fl*r3,ey-r3*.4);ctx.stroke();
  }else if(end==='foot'){
    ctx.fillStyle='#1c1c22';ctx.beginPath();
    ctx.ellipse(ex+fl*5,ey+2,r3+8,r3,0,0,7);ctx.fill();
    ctx.fillStyle='#34343e';ctx.beginPath();ctx.ellipse(ex+fl*5,ey-2,r3+8,r3*.6,0,0,7);ctx.fill();
  }
}

function drawFighter(f){
  const t=tick,fl=f.face,cx=f.x,baseY=f.y;
  ctx.save();
  if(f.flash>0&&f.flash%2===0)ctx.globalAlpha=.55;
  const gi=f.color,giD=shade(gi,-40),giL=shade(gi,34),skin='#e9b48c',skinD='#cf9266';
  const crouchOff=f.crouch?28:0;
  const hipY=baseY-58+crouchOff;
  const bob=f.state==='idle'?Math.sin(t*0.09)*1.6:f.state==='walk'?-Math.abs(Math.sin(t*0.32))*4:0;
  const chestY=baseY-104+crouchOff+bob;
  const headCx=cx+fl*3,headCy=baseY-130+crouchOff+bob,headR=15;

  // ----- pose state -----
  const atkKey=f.atk?f.atk.key:null, active=f.atk&&f.atk.phase==='active', notStart=f.atk&&f.atk.phase!=='startup';
  const punch=(atkKey==='lp'||atkKey==='hp')&&notStart;
  const kick=(atkKey==='lk'||atkKey==='hk')&&notStart;
  const special=atkKey==='special'&&notStart;
  const reach=f.atk&&f.atk.def?f.atk.def.reach||70:70;

  // ----- leg targets -----
  let backFootX=cx-fl*22,frontFootX=cx+fl*16,frontFootY=baseY,backFootY=baseY;
  let fKneeBx=fl*11,fKneeBy=-4,bKneeBx=fl*7,bKneeBy=-3;
  if(f.state==='walk'){const ph=Math.sin(t*0.32);
    frontFootX=cx+fl*(16+ph*12);backFootX=cx-fl*(22-ph*12);
    frontFootY=baseY-Math.max(0,ph)*7;backFootY=baseY-Math.max(0,-ph)*7;}
  if(f.state==='jump'){backFootX=cx-fl*6;frontFootX=cx+fl*14;
    frontFootY=baseY-26;backFootY=baseY-16;fKneeBx=fl*16;fKneeBy=2;bKneeBx=fl*10;bKneeBy=2;}
  if(kick){const hi=atkKey==='hk'?64:46;
    frontFootX=cx+fl*(40+reach*0.42);frontFootY=baseY-hi;fKneeBx=fl*20;fKneeBy=-hi*0.4;}

  // ===== BACK ARM (behind torso) =====
  const backShX=headCx-fl*13,backShY=chestY+6;
  let bHandX=cx-fl*2,bHandY=chestY+20,bElx=-fl*4,bEly=12;
  if(special){bHandX=cx+fl*34;bHandY=chestY+18;bElx=fl*4;bEly=6;}
  else if(f.blocking){bHandX=headCx+fl*6;bHandY=headCy+20;bElx=fl*2;bEly=8;}
  jointLimb(backShX,backShY,bHandX,bHandY,8,7,6,bElx,bEly,giD,giD,'fist',fl);

  // ===== BACK LEG =====
  jointLimb(cx-fl*3,hipY,backFootX,backFootY,12,9,7,bKneeBx,bKneeBy,giD,giD,'foot',fl);

  // ===== TORSO (gi jacket) =====
  const shHalf=20,wHalf=13;
  const tg=ctx.createLinearGradient(0,chestY-6,0,hipY+6);
  tg.addColorStop(0,giL);tg.addColorStop(1,giD);
  ctx.fillStyle=tg;ctx.beginPath();
  ctx.moveTo(headCx-shHalf,chestY+2);
  ctx.quadraticCurveTo(headCx-shHalf-2,chestY+26,cx-wHalf,hipY);
  ctx.lineTo(cx+wHalf,hipY);
  ctx.quadraticCurveTo(headCx+shHalf+2,chestY+26,headCx+shHalf,chestY+2);
  ctx.quadraticCurveTo(headCx,chestY-10,headCx-shHalf,chestY+2);ctx.closePath();ctx.fill();
  // jacket collar / open chest
  ctx.fillStyle=shade(skin,-6);ctx.beginPath();
  ctx.moveTo(headCx,chestY+2);ctx.lineTo(headCx+fl*9,chestY+34);ctx.lineTo(headCx-fl*1,chestY+30);ctx.closePath();ctx.fill();
  ctx.strokeStyle=giD;ctx.lineWidth=3;ctx.beginPath();
  ctx.moveTo(headCx-fl*9,chestY-2);ctx.lineTo(headCx+fl*4,chestY+36);ctx.stroke();
  // belt
  ctx.fillStyle=shade(gi,-58);ctx.fillRect(cx-wHalf-2,hipY-8,wHalf*2+4,11);
  ctx.fillStyle='#e8e8ee';ctx.fillRect(cx+fl*2,hipY-8,7,11);

  // ===== FRONT LEG =====
  jointLimb(cx+fl*3,hipY,frontFootX,frontFootY,12,9,7,fKneeBx,fKneeBy,gi,gi,'foot',fl);

  // ===== HEAD =====
  // neck
  capsule(headCx,chestY+2,headCx+fl*1,headCy+headR-4,8,7,skinD);
  // head
  const hg=ctx.createRadialGradient(headCx-fl*4,headCy-5,3,headCx,headCy,headR+3);
  hg.addColorStop(0,'#f4c79c');hg.addColorStop(1,skinD);
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(headCx,headCy,headR,0,7);ctx.fill();
  // ear
  ctx.fillStyle=skinD;ctx.beginPath();ctx.arc(headCx-fl*11,headCy+2,4,0,7);ctx.fill();
  // hair
  ctx.fillStyle='#2c2118';ctx.beginPath();
  ctx.arc(headCx,headCy-3,headR+1,Math.PI*1.02,Math.PI*0.05);
  ctx.lineTo(headCx-fl*(headR-2),headCy+4);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.arc(headCx-fl*(headR-3),headCy-2,5,0,7);ctx.fill();
  // headband (fighter look) in fighter color
  ctx.fillStyle=gi;ctx.fillRect(headCx-headR,headCy-5,headR*2,5);
  ctx.fillStyle=giD;
  const tail=Math.sin(t*0.2)*3;
  ctx.beginPath();ctx.moveTo(headCx-fl*headR,headCy-3);
  ctx.lineTo(headCx-fl*(headR+16),headCy+2+tail);
  ctx.lineTo(headCx-fl*(headR+15),headCy+7+tail);ctx.closePath();ctx.fill();
  // face: brow + eye
  ctx.strokeStyle='#3a2a1a';ctx.lineWidth=2.5;ctx.beginPath();
  ctx.moveTo(headCx+fl*3,headCy-1);ctx.lineTo(headCx+fl*12,headCy+1);ctx.stroke();
  ctx.fillStyle='#222';ctx.fillRect(headCx+fl*6,headCy+2,3.5,5);
  // mouth
  ctx.strokeStyle='rgba(90,40,30,.7)';ctx.lineWidth=1.5;ctx.beginPath();
  ctx.moveTo(headCx+fl*5,headCy+10);ctx.lineTo(headCx+fl*11,headCy+10);ctx.stroke();

  // ===== FRONT ARM (over everything) =====
  const frontShX=headCx+fl*12,frontShY=chestY+2;
  let fHandX=headCx+fl*15,fHandY=headCy+18,fElx=fl*8,fEly=12; // default boxing guard
  if(punch){fHandX=cx+fl*(reach*0.62+8);fHandY=chestY+(atkKey==='hp'?6:14);fElx=fl*3;fEly=2;}
  else if(special){fHandX=cx+fl*40;fHandY=chestY+16;fElx=fl*6;fEly=2;}
  else if(f.blocking){fHandX=headCx+fl*8;fHandY=headCy+6;fElx=fl*2;fEly=10;}
  jointLimb(frontShX,frontShY,fHandX,fHandY,9,7.5,6.5,fElx,fEly,giL,gi,'fist',fl);

  // ===== energy ball for special =====
  if(special){
    const bx=cx+fl*48,by=chestY+14,br=14+Math.sin(t*0.5)*3;
    const eg=ctx.createRadialGradient(bx,by,2,bx,by,br);
    eg.addColorStop(0,'#fff');eg.addColorStop(.5,'#ff7bff');eg.addColorStop(1,'rgba(150,0,200,0)');
    ctx.fillStyle=eg;ctx.beginPath();ctx.arc(bx,by,br,0,7);ctx.fill();
  }

  ctx.restore();
}

function drawProjectiles(){for(const p of projectiles){
  const g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,p.r);
  g.addColorStop(0,'#fff');g.addColorStop(.5,'#ff66ff');g.addColorStop(1,'rgba(120,0,180,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}}

function drawSparks(){for(const s of sparks){ctx.globalAlpha=s.life/18;ctx.fillStyle=s.col;
  ctx.fillRect(s.x,s.y,4,4);}ctx.globalAlpha=1;}

function drawHUD(){
  // P1 bar
  bar(30,30,360,P1,false);
  bar(W-30-360,30,360,P2,true);
  // names
  ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.textAlign='left';
  ctx.fillText(P1.name,30,72);ctx.textAlign='right';ctx.fillText(P2.name,W-30,72);
  // round pips
  for(let i=0;i<2;i++){
    ctx.fillStyle=P1.winsRound>i?'#ffdd33':'#444';
    ctx.beginPath();ctx.arc(30+i*22,86,7,0,7);ctx.fill();
    ctx.fillStyle=P2.winsRound>i?'#ffdd33':'#444';
    ctx.beginPath();ctx.arc(W-30-i*22,86,7,0,7);ctx.fill();
  }
  // super meters
  smeter(30,H-40,300,P1.super,false);
  smeter(W-30-300,H-40,300,P2.super,true);
  // timer
  ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.textAlign='center';
  ctx.fillText(Math.ceil(roundTime),W/2,55);
}
function bar(x,y,w,f,right){
  ctx.fillStyle='#222';ctx.fillRect(x,y,w,24);
  const pct=Math.max(0,f.hp/f.maxhp);
  ctx.fillStyle=pct>0.3?'#3ad13a':'#d13a3a';
  if(right)ctx.fillRect(x+w-w*pct,y,w*pct,24);else ctx.fillRect(x,y,w*pct,24);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(x,y,w,24);
}
function smeter(x,y,w,v,right){
  ctx.fillStyle='#111';ctx.fillRect(x,y,w,12);
  const pct=v/100;ctx.fillStyle=v>=50?'#ffcc00':'#3366cc';
  if(right)ctx.fillRect(x+w-w*pct,y,w*pct,12);else ctx.fillRect(x,y,w*pct,12);
  ctx.strokeStyle='#888';ctx.lineWidth=1;ctx.strokeRect(x,y,w,12);
  ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.textAlign=right?'right':'left';
  ctx.fillText('必杀槽 SP',right?x+w:x,y-3);
}

function drawTouchControls(){
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const name in TB){const b=TB[name];const on=touch[name];
    const r=12;
    ctx.fillStyle=on?'rgba(255,210,60,.55)':'rgba(255,255,255,.16)';
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(b.x+r,b.y);ctx.arcTo(b.x+b.w,b.y,b.x+b.w,b.y+b.h,r);
    ctx.arcTo(b.x+b.w,b.y+b.h,b.x,b.y+b.h,r);ctx.arcTo(b.x,b.y+b.h,b.x,b.y,r);
    ctx.arcTo(b.x,b.y,b.x+b.w,b.y,r);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold '+(b.t.length>1?20:30)+'px sans-serif';
    ctx.fillText(b.t,b.x+b.w/2,b.y+b.h/2+1);
  }
  ctx.textBaseline='alphabetic';
}

// ---------- game flow ----------
let state='title',tick=0,roundTime=60,roundTimer=0,aiOn=true,announce='',announceT=0;
function startMatch(){
  P1=Fighter(260,'#3a7bd1','蓝',false);
  P2=Fighter(700,'#d13a5a','红',true);
  P1.winsRound=0;P2.winsRound=0;
  newRound();state='fight';
}
function newRound(){
  P1.hp=P1.maxhp;P2.hp=P2.maxhp;P1.x=260;P2.x=700;
  P1.state=P2.state='idle';P1.atk=P2.atk=null;P1.super=P2.super=0;
  projectiles=[];sparks=[];roundTime=60;
  announce='准备…';announceT=70;state='roundstart';roundStartT=50;
}
let roundStartT=0,roundEndT=0;
function endRound(winner){
  if(winner)winner.winsRound++;
  announce=winner?winner.name+' 胜!':'平局!';announceT=110;
  state='roundend';roundEndT=110;
}

function update(){
  tick++;
  if(state==='roundstart'){
    roundStartT--; if(announceT>0)announceT--;
    if(roundStartT<=0){state='fight';announce='战斗!';announceT=40;}
    return;
  }
  if(state==='fight'){
    roundTime-=1/60;
    updateFighter(P1,P2);updateFighter(P2,P1);
    updateProjectiles();updateSparks();
    if(announceT>0)announceT--;
    if(P1.hp<=0||P2.hp<=0||roundTime<=0){
      let w=null;
      if(P1.hp>P2.hp)w=P1;else if(P2.hp>P1.hp)w=P2;
      endRound(w);
    }
    return;
  }
  if(state==='roundend'){
    updateSparks();updateFighter(P1,P2);updateFighter(P2,P1);
    roundEndT--; if(announceT>0)announceT--;
    if(roundEndT<=0){
      if(P1.winsRound>=2||P2.winsRound>=2){
        matchWinner=P1.winsRound>=2?P1:P2;state='matchover';
      }else newRound();
    }
    return;
  }
}
let matchWinner=null;

function render(){
  drawBg();
  if(state==='title'){
    ctx.textAlign='center';
    ctx.fillStyle='#ffcc33';ctx.font='bold 72px sans-serif';
    ctx.fillText('格斗之王',W/2,200);
    ctx.fillStyle='#fff';ctx.font='28px sans-serif';
    ctx.fillText('FIST OF FIGHTERS',W/2,250);
    ctx.font='22px sans-serif';
    ctx.fillStyle=tick%60<40?'#fff':'#888';
    ctx.fillText(isTouch?'点击屏幕开始游戏':'按 Enter 开始游戏',W/2,340);
    ctx.fillStyle='#bbb';ctx.font='16px sans-serif';
    if(isTouch){
      ctx.fillText('使用屏幕左侧方向键 + 右侧拳脚按钮',W/2,400);
      ctx.fillText('防御: 按住「后退」方向   必杀: 必杀键(满50槽)',W/2,428);
    }else{
      ctx.fillText('移动: ← → ↑(跳) ↓(蹲/防御:后退方向)',W/2,400);
      ctx.fillText('J 轻拳   K 重拳   U 轻脚   I 重脚   空格 必杀(满50槽)',W/2,428);
    }
    ctx.fillText('单人对战电脑 AI · 三局两胜',W/2,460);
    return;
  }
  // shadows
  ctx.fillStyle='rgba(0,0,0,.35)';
  for(const f of [P1,P2]){ctx.beginPath();ctx.ellipse(f.x,GROUND+6,30,8,0,0,7);ctx.fill();}
  drawFighter(P1);drawFighter(P2);
  drawProjectiles();drawSparks();drawHUD();
  if(isTouch&&(state==='fight'||state==='roundstart'||state==='roundend'))drawTouchControls();
  if(announceT>0){
    ctx.textAlign='center';ctx.font='bold 60px sans-serif';
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillText(announce,W/2+3,H/2+3);
    ctx.fillStyle='#ffdd33';ctx.fillText(announce,W/2,H/2);
  }
  if(state==='matchover'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ffcc33';ctx.font='bold 56px sans-serif';
    ctx.fillText(matchWinner.name+' 获得最终胜利!',W/2,H/2-20);
    ctx.fillStyle='#fff';ctx.font='24px sans-serif';
    ctx.fillText('按 Enter 返回标题',W/2,H/2+40);
  }
}

function loop(){update();render();requestAnimationFrame(loop);}
loop();
</script>
